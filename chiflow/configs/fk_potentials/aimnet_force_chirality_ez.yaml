# @package model
# AIMNet2-rxn force potential plus the chirality and E/Z potentials, summed;
# the AIMNet counterpart of gxtb_force_chirality_ez.
# The force is the mean over the ensemble members; uncertainty_weight adds the
# RMS spread of the members' forces (model.fk_potential_fns.1.uncertainty_weight=1.0).
# The E/Z potential covers every double bond with an E/Z tag in reactant or
# product (persistent_only: only bonds that are double on both sides).
fk_potential_fns:
  - _target_: flow_matching.utils.compute_chiral_volume
    _partial_: true
  - _target_: flow_matching.aimnet_potential.AIMNetForcePotential
    transform: log1p
    weight: 1.0
    ensemble_members: [0, 1, 2, 3]
    uncertainty_weight: 0.0
  - _target_: flow_matching.ez_potential.make_ez_potential
    persistent_only: false
    weight: 1.0
